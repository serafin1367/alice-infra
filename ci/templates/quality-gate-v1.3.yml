# ALICE Quality Gate v1.3 — współdzielony szablon GitLab CI
# Repozytorium alice-infra musi być dostępne w GitLabie pod alice/infra;
# zalecane jest przypięcie include do taga/commita zamiast ruchomego main.
# Każdy serwis definiuje QUALITY_TEST_COMMAND i opcjonalnie QUALITY_DOCKER_COMMAND.
stages:
  - test
  - docker-smoke

.alice-node-quality:
  stage: test
  image: node:22-alpine
  tags: [alice-quality]
  variables:
    GIT_STRATEGY: fetch
  script:
    - apk add --no-cache bash git
    - test -n "${QUALITY_TEST_COMMAND:-}"
    - bash -lc "$QUALITY_TEST_COMMAND"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - quality/reports/
    reports:
      junit: quality/reports/junit.xml

# Optional; requires an explicitly configured *isolated* Docker daemon.
# Do not attach host production docker.sock to untrusted CI jobs.
.alice-docker-smoke:
  stage: docker-smoke
  image: docker:27-cli
  tags: [alice-quality-docker]
  variables:
    GIT_STRATEGY: fetch
  script:
    - apk add --no-cache bash
    - test -n "${QUALITY_DOCKER_COMMAND:-}"
    - bash -lc "$QUALITY_DOCKER_COMMAND"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - quality/reports/
