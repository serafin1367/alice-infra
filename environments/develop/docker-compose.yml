services:
  alice-web:
    build:
      context: ../../../alice-web
    container_name: ${ALICE_WEB_CONTAINER_NAME:-alice-dev-web}
    restart: unless-stopped
    environment:
      KNOWLEDGE_UPSTREAM: ${ALICE_WEB_KNOWLEDGE_UPSTREAM:-http://knowledge-service:8087}
      WORK_UPSTREAM: ${ALICE_WEB_WORK_UPSTREAM:-http://work-service:8085}
      TIME_UPSTREAM: ${ALICE_WEB_TIME_UPSTREAM:-http://time-coordinator-service:8082}
      DASHBOARD_UPSTREAM: ${ALICE_WEB_DASHBOARD_UPSTREAM:-http://dashboard-service:8088}
      SHOPPING_UPSTREAM: ${ALICE_WEB_SHOPPING_UPSTREAM:-http://shopping-service:8086}
      BUDGET_UPSTREAM: ${ALICE_WEB_BUDGET_UPSTREAM:-http://budget-service:8087}
      MAIL_UPSTREAM: ${ALICE_WEB_MAIL_UPSTREAM:-http://mail-service:8083}
      WEATHER_UPSTREAM: ${ALICE_WEB_WEATHER_UPSTREAM:-http://weather-service:8081}
      LLM_UPSTREAM: ${ALICE_WEB_LLM_UPSTREAM:-http://llm-service:8084}
      SMARTHOME_UPSTREAM: ${ALICE_WEB_SMARTHOME_UPSTREAM:-http://smarthome-service:8091}
    ports:
      - "${ALICE_WEB_BIND_IP:-127.0.0.1}:${ALICE_WEB_PUBLIC_PORT:-19080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard-service:
    build:
      context: ../../../microservices/dashboard
    restart: unless-stopped
    environment:
      PORT: 8088
      DASHBOARD_DATA_FILE: /data/dashboard.json
    volumes:
      - dashboard_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17
    container_name: ${POSTGRES_CONTAINER_NAME:-alice-dev-postgres}
    hostname: ${POSTGRES_HOSTNAME:-postgres}
    restart: unless-stopped
    environment:
      HEALTH_DB_NAME: ${HEALTH_DB_NAME:-health}
      HEALTH_DB_USERNAME: ${HEALTH_DB_USERNAME:-health}
      HEALTH_DB_PASSWORD: ${HEALTH_DB_PASSWORD:-dev-health}
      LLM_BASE_URL: http://llm-service:8084
      POSTGRES_DB: ${POSTGRES_BOOTSTRAP_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_BOOTSTRAP_DB: ${POSTGRES_BOOTSTRAP_DB:-postgres}
      WEATHER_DB_NAME: ${WEATHER_DB_NAME:-weather}
      WEATHER_DB_USERNAME: ${WEATHER_DB_USERNAME}
      WEATHER_DB_PASSWORD: ${WEATHER_DB_PASSWORD}
      TIME_COORDINATOR_DB_NAME: ${TIME_COORDINATOR_DB_NAME:-time_coordinator}
      TIME_COORDINATOR_DB_USERNAME: ${TIME_COORDINATOR_DB_USERNAME}
      TIME_COORDINATOR_DB_PASSWORD: ${TIME_COORDINATOR_DB_PASSWORD}
      MAIL_DB_NAME: ${MAIL_DB_NAME:-mail}
      MAIL_DB_USERNAME: ${MAIL_DB_USERNAME:-mail}
      MAIL_DB_PASSWORD: ${MAIL_DB_PASSWORD:-dev-mail}
      LLM_DB_NAME: ${LLM_DB_NAME:-llm}
      LLM_DB_USERNAME: ${LLM_DB_USERNAME:-llm}
      LLM_DB_PASSWORD: ${LLM_DB_PASSWORD:-dev-llm}
      WORK_DB_NAME: ${WORK_DB_NAME:-work}
      WORK_DB_USERNAME: ${WORK_DB_USERNAME:-work}
      WORK_DB_PASSWORD: ${WORK_DB_PASSWORD:-dev-work}
      SHOPPING_DB_NAME: ${SHOPPING_DB_NAME:-shopping}
      SHOPPING_DB_USERNAME: ${SHOPPING_DB_USERNAME:-shopping}
      SHOPPING_DB_PASSWORD: ${SHOPPING_DB_PASSWORD:-dev-shopping}
      BUDGET_DB_NAME: ${BUDGET_DB_NAME:-budget}
      BUDGET_DB_USERNAME: ${BUDGET_DB_USERNAME:-budget}
      BUDGET_DB_PASSWORD: ${BUDGET_DB_PASSWORD:-dev-budget}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_BOOTSTRAP_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${RABBITMQ_CONTAINER_NAME:-alice-dev-rabbitmq}
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-alice}
    ports:
      - "${RABBITMQ_AMQP_PORT:-55672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  weather-service:
    build:
      context: ../../../microservices/weather
    container_name: ${WEATHER_CONTAINER_NAME:-alice-dev-weather-service}
    hostname: ${WEATHER_HOSTNAME:-weather-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      WEATHER_DB_URL: jdbc:postgresql://postgres:5432/${WEATHER_DB_NAME:-weather}
      WEATHER_DB_USERNAME: ${WEATHER_DB_USERNAME}
      WEATHER_DB_PASSWORD: ${WEATHER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-alice}
      NOTIFICATIONS_EXCHANGE: ${NOTIFICATIONS_EXCHANGE:-notifications.exchange}
      NOTIFICATIONS_ROUTING_KEY: ${NOTIFICATIONS_ROUTING_KEY:-notifications.created}
    ports:
      - "${WEATHER_PUBLIC_PORT:-19081}:8081"

  time-coordinator-service:
    build:
      context: ../../../microservices/time_coordinator
    container_name: ${TIME_COORDINATOR_CONTAINER_NAME:-alice-dev-time-coordinator-service}
    hostname: ${TIME_COORDINATOR_HOSTNAME:-time-coordinator-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      TIME_COORDINATOR_DB_URL: jdbc:postgresql://postgres:5432/${TIME_COORDINATOR_DB_NAME:-time_coordinator}
      TIME_COORDINATOR_DB_USERNAME: ${TIME_COORDINATOR_DB_USERNAME}
      TIME_COORDINATOR_DB_PASSWORD: ${TIME_COORDINATOR_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-alice}
      GOOGLE_CALENDAR_APPLICATION_NAME: ${GOOGLE_CALENDAR_APPLICATION_NAME:-time-coordinator-dev}
      GOOGLE_CALENDAR_CREDENTIALS_PATH: /app/secrets/credentials.json
      GOOGLE_CALENDAR_TOKENS_DIRECTORY_PATH: /app/secrets/tokens
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_CALENDAR_OAUTH_REDIRECT_URI: ${GOOGLE_CALENDAR_OAUTH_REDIRECT_URI:-http://localhost:19082/api/google/calendar/oauth/callback}
      GOOGLE_CALENDAR_SYNC_RATE_MS: ${GOOGLE_CALENDAR_SYNC_RATE_MS:-3600000}
      GOOGLE_TASKS_SYNC_RATE_MS: ${GOOGLE_TASKS_SYNC_RATE_MS:-3600000}
      NOTIFICATIONS_EXCHANGE: ${NOTIFICATIONS_EXCHANGE:-notifications.exchange}
      NOTIFICATIONS_QUEUE: ${NOTIFICATIONS_QUEUE:-time-coordinator.notifications.queue}
      NOTIFICATIONS_ROUTING_KEY: ${NOTIFICATIONS_ROUTING_KEY:-notifications.created}
    ports:
      - "${TIME_COORDINATOR_PUBLIC_PORT:-19082}:8082"
    volumes:
      - ./secrets/google-calendar:/app/secrets

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ${MAILHOG_CONTAINER_NAME:-alice-dev-mailhog}
    hostname: ${MAILHOG_HOSTNAME:-mailhog}
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-11125}:1025"
      - "${MAILHOG_UI_PORT:-19025}:8025"

  mail-service:
    build:
      context: ../../../microservices/mail
    container_name: ${MAIL_CONTAINER_NAME:-alice-dev-mail-service}
    hostname: ${MAIL_HOSTNAME:-mail-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      MAIL_DB_URL: jdbc:postgresql://postgres:5432/${MAIL_DB_NAME:-mail}
      MAIL_DB_USERNAME: ${MAIL_DB_USERNAME:-mail}
      MAIL_DB_PASSWORD: ${MAIL_DB_PASSWORD:-mail123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-alice}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mailhog}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-1025}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_DEFAULT_FROM: ${MAIL_DEFAULT_FROM:-alice@localhost}
      MAIL_NOTIFICATIONS_QUEUE: ${MAIL_NOTIFICATIONS_QUEUE:-mail.notifications.queue}
      LLM_BASE_URL: http://llm-service:8084
    ports:
      - "${MAIL_PUBLIC_PORT:-19083}:8083"

  llm-service:
    build:
      context: ../../../microservices/llm
    container_name: ${LLM_CONTAINER_NAME:-alice-dev-llm-service}
    hostname: ${LLM_HOSTNAME:-llm-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      WEATHER_BASE_URL: http://weather-service:8081
      WORK_BASE_URL: http://work-service:8085
      TIME_COORDINATOR_BASE_URL: http://time-coordinator-service:8082
      HEALTH_BASE_URL: http://health-service:8089
      APP_SMARTHOME_BASE_URL: http://smarthome-service:8091
      HEALTH_INTERNAL_TOKEN: ${HEALTH_INTERNAL_TOKEN:-alice-local-health-context}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      LLM_DB_URL: jdbc:postgresql://postgres:5432/${LLM_DB_NAME:-llm}
      LLM_DB_USERNAME: ${LLM_DB_USERNAME:-llm}
      LLM_DB_PASSWORD: ${LLM_DB_PASSWORD:-dev-llm}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-alice}
    ports:
      - "${LLM_PUBLIC_PORT:-8084}:8084"

  work-service:
    build:
      context: ../../../microservices/work
    container_name: ${WORK_CONTAINER_NAME:-alice-dev-work-service}
    hostname: ${WORK_HOSTNAME:-work-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      WORK_DB_URL: jdbc:postgresql://postgres:5432/${WORK_DB_NAME:-work}
      WORK_DB_USERNAME: ${WORK_DB_USERNAME:-work}
      WORK_DB_PASSWORD: ${WORK_DB_PASSWORD:-dev-work}
      WORK_ATTACHMENTS_DIRECTORY: /app/data/task-attachments
      WORK_JIRA_URL: ${WORK_JIRA_URL:-https://jira.consolia.pl}
      WORK_JIRA_USERNAME: ${WORK_JIRA_USERNAME:-}
      WORK_JIRA_PASSWORD: ${WORK_JIRA_PASSWORD:-}
      WORK_JIRA_PAGE_SIZE: ${WORK_JIRA_PAGE_SIZE:-100}
    ports:
      - "${WORK_PUBLIC_PORT:-19085}:8085"
    volumes:
      - work_attachments:/app/data/task-attachments

  shopping-service:
    build:
      context: ../../../microservices/shopping
    container_name: ${SHOPPING_CONTAINER_NAME:-alice-dev-shopping-service}
    hostname: ${SHOPPING_HOSTNAME:-shopping-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8086
      SHOPPING_DB_URL: jdbc:postgresql://postgres:5432/${SHOPPING_DB_NAME:-shopping}
      SHOPPING_DB_USERNAME: ${SHOPPING_DB_USERNAME:-shopping}
      SHOPPING_DB_PASSWORD: ${SHOPPING_DB_PASSWORD:-dev-shopping}
    ports:
      - "${SHOPPING_PUBLIC_PORT:-19086}:8086"

  knowledge-service:
    build:
      context: ../../../microservices/knowledge
    container_name: ${KNOWLEDGE_CONTAINER_NAME:-alice-dev-knowledge-service}
    hostname: ${KNOWLEDGE_HOSTNAME:-knowledge-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8087
      KNOWLEDGE_DB_URL: jdbc:postgresql://postgres:5432/${KNOWLEDGE_DB_NAME:-knowledge}
      KNOWLEDGE_DB_USERNAME: ${KNOWLEDGE_DB_USERNAME:-knowledge}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:-dev-knowledge}
      KNOWLEDGE_STORAGE_DIRECTORY: /app/data/projects
      LLM_BASE_URL: http://llm-service:8084
    ports:
      - "${KNOWLEDGE_PUBLIC_PORT:-19087}:8087"
    volumes:
      - knowledge_projects:/app/data/projects

  budget-service:
    build:
      context: ../../../microservices/budget
    container_name: ${BUDGET_CONTAINER_NAME:-alice-dev-budget-service}
    hostname: ${BUDGET_HOSTNAME:-budget-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LLM_BASE_URL: http://llm-service:8084
      SERVER_PORT: 8087
      BUDGET_DB_URL: jdbc:postgresql://postgres:5432/${BUDGET_DB_NAME:-budget}
      BUDGET_DB_USERNAME: ${BUDGET_DB_USERNAME:-budget}
      BUDGET_DB_PASSWORD: ${BUDGET_DB_PASSWORD:-dev-budget}
    ports:
      - "${BUDGET_PUBLIC_PORT:-19088}:8087"

  health-service:
    build:
      context: ../../../microservices/health
    container_name: alice-dev-health-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8089
      HEALTH_DB_URL: jdbc:postgresql://postgres:5432/${HEALTH_DB_NAME:-health}
      HEALTH_DB_USERNAME: ${HEALTH_DB_USERNAME:-health}
      HEALTH_DB_PASSWORD: ${HEALTH_DB_PASSWORD:-dev-health}
      HEALTH_INTERNAL_TOKEN: ${HEALTH_INTERNAL_TOKEN:-alice-local-health-context}
      LLM_BASE_URL: http://llm-service:8084
    ports:
      - "127.0.0.1:${HEALTH_PUBLIC_PORT:-19089}:8089"

  smarthome-service:
    build:
      context: ../../../microservices/smarthome
    container_name: ${SMARTHOME_CONTAINER_NAME:-alice-dev-smarthome-service}
    hostname: ${SMARTHOME_HOSTNAME:-smarthome-service}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8091
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      HOME_ASSISTANT_TIMEOUT_MS: ${HOME_ASSISTANT_TIMEOUT_MS:-8000}
      SMARTHOME_DATA_DIR: /data
    volumes:
      - smarthome_data:/data
    ports:
      - "127.0.0.1:${SMARTHOME_PUBLIC_PORT:-19091}:8091"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dashboard_data:
  postgres_data:
  rabbitmq_data:
  work_attachments:
  knowledge_projects:
  smarthome_data:
