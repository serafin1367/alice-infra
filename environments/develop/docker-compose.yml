services:
  postgres:
    image: postgres:17
    container_name: ${POSTGRES_CONTAINER_NAME:-alice-dev-postgres}
    hostname: ${POSTGRES_HOSTNAME:-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_BOOTSTRAP_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_BOOTSTRAP_DB: ${POSTGRES_BOOTSTRAP_DB:-postgres}
      WEATHER_DB_NAME: ${WEATHER_DB_NAME:-weather}
      WEATHER_DB_USERNAME: ${WEATHER_DB_USERNAME}
      WEATHER_DB_PASSWORD: ${WEATHER_DB_PASSWORD}
      TIME_COORDINATOR_DB_NAME: ${TIME_COORDINATOR_DB_NAME:-time_coordinator}
      TIME_COORDINATOR_DB_USERNAME: ${TIME_COORDINATOR_DB_USERNAME}
      TIME_COORDINATOR_DB_PASSWORD: ${TIME_COORDINATOR_DB_PASSWORD}
      MAIL_DB_NAME: ${MAIL_DB_NAME:-mail}
      MAIL_DB_USERNAME: ${MAIL_DB_USERNAME:-mail}
      MAIL_DB_PASSWORD: ${MAIL_DB_PASSWORD:-dev-mail}
      LLM_DB_NAME: ${LLM_DB_NAME:-llm}
      LLM_DB_USERNAME: ${LLM_DB_USERNAME:-llm}
      LLM_DB_PASSWORD: ${LLM_DB_PASSWORD:-dev-llm}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_BOOTSTRAP_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${RABBITMQ_CONTAINER_NAME:-alice-dev-rabbitmq}
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-alice}
    ports:
      - "${RABBITMQ_AMQP_PORT:-55672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  weather-service:
    build:
      context: ../../../microservices/weather
    container_name: ${WEATHER_CONTAINER_NAME:-alice-dev-weather-service}
    hostname: ${WEATHER_HOSTNAME:-weather-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      WEATHER_DB_URL: jdbc:postgresql://postgres:5432/${WEATHER_DB_NAME:-weather}
      WEATHER_DB_USERNAME: ${WEATHER_DB_USERNAME}
      WEATHER_DB_PASSWORD: ${WEATHER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-alice}
      NOTIFICATIONS_EXCHANGE: ${NOTIFICATIONS_EXCHANGE:-notifications.exchange}
      NOTIFICATIONS_ROUTING_KEY: ${NOTIFICATIONS_ROUTING_KEY:-notifications.created}
    ports:
      - "${WEATHER_PUBLIC_PORT:-18081}:8081"

  time-coordinator-service:
    build:
      context: ../../../microservices/time_coordinator
    container_name: ${TIME_COORDINATOR_CONTAINER_NAME:-alice-dev-time-coordinator-service}
    hostname: ${TIME_COORDINATOR_HOSTNAME:-time-coordinator-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      TIME_COORDINATOR_DB_URL: jdbc:postgresql://postgres:5432/${TIME_COORDINATOR_DB_NAME:-time_coordinator}
      TIME_COORDINATOR_DB_USERNAME: ${TIME_COORDINATOR_DB_USERNAME}
      TIME_COORDINATOR_DB_PASSWORD: ${TIME_COORDINATOR_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-alice}
      GOOGLE_CALENDAR_APPLICATION_NAME: ${GOOGLE_CALENDAR_APPLICATION_NAME:-time-coordinator-dev}
      GOOGLE_CALENDAR_CREDENTIALS_PATH: /app/secrets/credentials.json
      GOOGLE_CALENDAR_TOKENS_DIRECTORY_PATH: /app/secrets/tokens
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_CALENDAR_OAUTH_REDIRECT_URI: ${GOOGLE_CALENDAR_OAUTH_REDIRECT_URI:-http://localhost:18082/api/google/calendar/oauth/callback}
      GOOGLE_CALENDAR_SYNC_RATE_MS: ${GOOGLE_CALENDAR_SYNC_RATE_MS:-3600000}
      GOOGLE_TASKS_SYNC_RATE_MS: ${GOOGLE_TASKS_SYNC_RATE_MS:-3600000}
      NOTIFICATIONS_EXCHANGE: ${NOTIFICATIONS_EXCHANGE:-notifications.exchange}
      NOTIFICATIONS_QUEUE: ${NOTIFICATIONS_QUEUE:-time-coordinator.notifications.queue}
      NOTIFICATIONS_ROUTING_KEY: ${NOTIFICATIONS_ROUTING_KEY:-notifications.created}
    ports:
      - "${TIME_COORDINATOR_PUBLIC_PORT:-18082}:8082"
    volumes:
      - ./secrets/google-calendar:/app/secrets

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ${MAILHOG_CONTAINER_NAME:-alice-dev-mailhog}
    hostname: ${MAILHOG_HOSTNAME:-mailhog}
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-11025}:1025"
      - "${MAILHOG_UI_PORT:-18025}:8025"

  mail-service:
    build:
      context: ../../../microservices/mail
    container_name: ${MAIL_CONTAINER_NAME:-alice-dev-mail-service}
    hostname: ${MAIL_HOSTNAME:-mail-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      MAIL_DB_URL: jdbc:postgresql://postgres:5432/${MAIL_DB_NAME:-mail}
      MAIL_DB_USERNAME: ${MAIL_DB_USERNAME:-mail}
      MAIL_DB_PASSWORD: ${MAIL_DB_PASSWORD:-mail123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-alice}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mailhog}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-1025}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_DEFAULT_FROM: ${MAIL_DEFAULT_FROM:-alice@localhost}
      MAIL_NOTIFICATIONS_QUEUE: ${MAIL_NOTIFICATIONS_QUEUE:-mail.notifications.queue}
      LLM_BASE_URL: http://llm-service:8084
    ports:
      - "${MAIL_PUBLIC_PORT:-18083}:8083"

  llm-service:
    build:
      context: ../../../microservices/llm
    container_name: ${LLM_CONTAINER_NAME:-alice-dev-llm-service}
    hostname: ${LLM_HOSTNAME:-llm-service}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      WEATHER_BASE_URL: http://weather-service:8081
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      LLM_DB_URL: jdbc:postgresql://postgres:5432/${LLM_DB_NAME:-llm}
      LLM_DB_USERNAME: ${LLM_DB_USERNAME:-llm}
      LLM_DB_PASSWORD: ${LLM_DB_PASSWORD:-dev-llm}
    ports:
      - "${LLM_PUBLIC_PORT:-8084}:8084"

volumes:
  postgres_data:
  rabbitmq_data:
