services:
  postgres:
    image: postgres:17
    container_name: ${POSTGRES_CONTAINER_NAME:-alice-postgres}
    hostname: ${POSTGRES_HOSTNAME:-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_BOOTSTRAP_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_BOOTSTRAP_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${RABBITMQ_CONTAINER_NAME:-alice-rabbitmq}
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-alice}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  weather-service:
    build:
      context: ../../../microservices/weather
    container_name: ${WEATHER_CONTAINER_NAME:-alice-weather-service}
    hostname: ${WEATHER_HOSTNAME:-weather-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      WEATHER_DB_URL: jdbc:postgresql://postgres:5432/${WEATHER_DB_NAME:-weather}
      WEATHER_DB_USERNAME: ${WEATHER_DB_USERNAME}
      WEATHER_DB_PASSWORD: ${WEATHER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "${WEATHER_PUBLIC_PORT:-8081}:8081"

  time-coordinator-service:
    build:
      context: ../../../microservices/time_coordinator
    container_name: ${TIME_COORDINATOR_CONTAINER_NAME:-alice-time-coordinator-service}
    hostname: ${TIME_COORDINATOR_HOSTNAME:-time-coordinator-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      TIME_COORDINATOR_DB_URL: jdbc:postgresql://postgres:5432/${TIME_COORDINATOR_DB_NAME:-time_coordinator}
      TIME_COORDINATOR_DB_USERNAME: ${TIME_COORDINATOR_DB_USERNAME}
      TIME_COORDINATOR_DB_PASSWORD: ${TIME_COORDINATOR_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GOOGLE_CALENDAR_APPLICATION_NAME: ${GOOGLE_CALENDAR_APPLICATION_NAME:-time-coordinator}
      GOOGLE_CALENDAR_CREDENTIALS_PATH: /app/secrets/credentials.json
      GOOGLE_CALENDAR_TOKENS_DIRECTORY_PATH: /app/secrets/tokens
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_CALENDAR_SYNC_RATE_MS: ${GOOGLE_CALENDAR_SYNC_RATE_MS:-3600000}
    ports:
      - "${TIME_COORDINATOR_PUBLIC_PORT:-8082}:8082"
      - "${GOOGLE_OAUTH_CALLBACK_PORT:-8888}:8888"
    volumes:
      - ./secrets/google-calendar:/app/secrets

volumes:
  postgres_data:
  rabbitmq_data:
