services:
  alice-web:
    build:
      context: ../../../alice-web
    container_name: ${ALICE_WEB_CONTAINER_NAME:-alice-web}
    restart: unless-stopped
    environment:
      KNOWLEDGE_UPSTREAM: ${ALICE_WEB_KNOWLEDGE_UPSTREAM:-http://knowledge-service:8087}
      SHOPPING_UPSTREAM: ${ALICE_WEB_SHOPPING_UPSTREAM:-http://shopping-service:8086}
    ports:
      - "${ALICE_WEB_BIND_IP:-127.0.0.1}:${ALICE_WEB_PUBLIC_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17
    container_name: ${POSTGRES_CONTAINER_NAME:-alice-postgres}
    hostname: ${POSTGRES_HOSTNAME:-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_BOOTSTRAP_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_BOOTSTRAP_DB: ${POSTGRES_BOOTSTRAP_DB:-postgres}
      WEATHER_DB_NAME: ${WEATHER_DB_NAME:-weather}
      WEATHER_DB_USERNAME: ${WEATHER_DB_USERNAME}
      WEATHER_DB_PASSWORD: ${WEATHER_DB_PASSWORD}
      TIME_COORDINATOR_DB_NAME: ${TIME_COORDINATOR_DB_NAME:-time_coordinator}
      TIME_COORDINATOR_DB_USERNAME: ${TIME_COORDINATOR_DB_USERNAME}
      TIME_COORDINATOR_DB_PASSWORD: ${TIME_COORDINATOR_DB_PASSWORD}
      MAIL_DB_NAME: ${MAIL_DB_NAME:-mail}
      MAIL_DB_USERNAME: ${MAIL_DB_USERNAME}
      MAIL_DB_PASSWORD: ${MAIL_DB_PASSWORD}
      LLM_DB_NAME: ${LLM_DB_NAME:-llm}
      LLM_DB_USERNAME: ${LLM_DB_USERNAME:-llm}
      LLM_DB_PASSWORD: ${LLM_DB_PASSWORD:-llm123}
      WORK_DB_NAME: ${WORK_DB_NAME:-work}
      WORK_DB_USERNAME: ${WORK_DB_USERNAME:-work}
      WORK_DB_PASSWORD: ${WORK_DB_PASSWORD:-work123}
      SHOPPING_DB_NAME: ${SHOPPING_DB_NAME:-shopping}
      SHOPPING_DB_USERNAME: ${SHOPPING_DB_USERNAME:-shopping}
      SHOPPING_DB_PASSWORD: ${SHOPPING_DB_PASSWORD:-shopping123}
      KNOWLEDGE_DB_NAME: ${KNOWLEDGE_DB_NAME:-knowledge}
      KNOWLEDGE_DB_USERNAME: ${KNOWLEDGE_DB_USERNAME:-knowledge}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Set KNOWLEDGE_DB_PASSWORD in production .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_BOOTSTRAP_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${RABBITMQ_CONTAINER_NAME:-alice-rabbitmq}
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-alice}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  weather-service:
    build:
      context: ../../../microservices/weather
    container_name: ${WEATHER_CONTAINER_NAME:-alice-weather-service}
    hostname: ${WEATHER_HOSTNAME:-weather-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      WEATHER_DB_URL: jdbc:postgresql://postgres:5432/${WEATHER_DB_NAME:-weather}
      WEATHER_DB_USERNAME: ${WEATHER_DB_USERNAME}
      WEATHER_DB_PASSWORD: ${WEATHER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-alice}
    ports:
      - "${WEATHER_PUBLIC_PORT:-8081}:8081"

  time-coordinator-service:
    build:
      context: ../../../microservices/time_coordinator
    container_name: ${TIME_COORDINATOR_CONTAINER_NAME:-alice-time-coordinator-service}
    hostname: ${TIME_COORDINATOR_HOSTNAME:-time-coordinator-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      TIME_COORDINATOR_DB_URL: jdbc:postgresql://postgres:5432/${TIME_COORDINATOR_DB_NAME:-time_coordinator}
      TIME_COORDINATOR_DB_USERNAME: ${TIME_COORDINATOR_DB_USERNAME}
      TIME_COORDINATOR_DB_PASSWORD: ${TIME_COORDINATOR_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-alice}
      GOOGLE_CALENDAR_APPLICATION_NAME: ${GOOGLE_CALENDAR_APPLICATION_NAME:-time-coordinator}
      GOOGLE_CALENDAR_CREDENTIALS_PATH: /app/secrets/credentials.json
      GOOGLE_CALENDAR_TOKENS_DIRECTORY_PATH: /app/secrets/tokens
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_CALENDAR_OAUTH_REDIRECT_URI: ${GOOGLE_CALENDAR_OAUTH_REDIRECT_URI:-https://google-auth.mbb.net.pl/api/google/calendar/oauth/callback}
      GOOGLE_CALENDAR_SYNC_RATE_MS: ${GOOGLE_CALENDAR_SYNC_RATE_MS:-3600000}
    ports:
      - "${TIME_COORDINATOR_PUBLIC_PORT:-8082}:8082"
    volumes:
      - ./secrets/google-calendar:/app/secrets

  mail-service:
    build:
      context: ../../../microservices/mail
    container_name: ${MAIL_CONTAINER_NAME:-alice-mail-service}
    hostname: ${MAIL_HOSTNAME:-mail-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      MAIL_DB_URL: jdbc:postgresql://postgres:5432/${MAIL_DB_NAME:-mail}
      MAIL_DB_USERNAME: ${MAIL_DB_USERNAME}
      MAIL_DB_PASSWORD: ${MAIL_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-alice}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_DEFAULT_FROM: ${MAIL_DEFAULT_FROM}
      MAIL_ATTACHMENTS_BASE_DIR: /app/storage/attachments
      MAIL_NOTIFICATIONS_QUEUE: ${MAIL_NOTIFICATIONS_QUEUE:-mail.notifications.queue}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm-service:8084}
    ports:
      - "${MAIL_PUBLIC_PORT:-8083}:8083"
    volumes:
      - ${MAIL_ATTACHMENTS_HOST_DIR:-./data/mail-attachments}:/app/storage/attachments

  llm-service:
    build:
      context: ../../../microservices/llm
    container_name: ${LLM_CONTAINER_NAME:-alice-llm-service}
    hostname: ${LLM_HOSTNAME:-llm-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      WEATHER_BASE_URL: ${WEATHER_BASE_URL:-http://weather-service:8081}
      WORK_BASE_URL: ${WORK_BASE_URL:-http://work-service:8085}
      TIME_COORDINATOR_BASE_URL: ${TIME_COORDINATOR_BASE_URL:-http://time-coordinator-service:8082}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-alice}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      LLM_DB_URL: jdbc:postgresql://postgres:5432/${LLM_DB_NAME:-llm}
      LLM_DB_USERNAME: ${LLM_DB_USERNAME:-llm}
      LLM_DB_PASSWORD: ${LLM_DB_PASSWORD:-llm123}
    ports:
      - "${LLM_PUBLIC_PORT:-8084}:8084"

  work-service:
    build:
      context: ../../../microservices/work
    container_name: ${WORK_CONTAINER_NAME:-alice-work-service}
    hostname: ${WORK_HOSTNAME:-work-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8085
      WORK_DB_URL: jdbc:postgresql://postgres:5432/${WORK_DB_NAME:-work}
      WORK_DB_USERNAME: ${WORK_DB_USERNAME:-work}
      WORK_DB_PASSWORD: ${WORK_DB_PASSWORD:-work123}
      WORK_ATTACHMENTS_DIRECTORY: /app/storage/task-attachments
      WORK_JIRA_URL: ${WORK_JIRA_URL}
      WORK_JIRA_USERNAME: ${WORK_JIRA_USERNAME}
      WORK_JIRA_PASSWORD: ${WORK_JIRA_PASSWORD}
      WORK_JIRA_PAGE_SIZE: ${WORK_JIRA_PAGE_SIZE:-100}
    ports:
      - "${WORK_PUBLIC_PORT:-8085}:8085"
    volumes:
      - ${WORK_ATTACHMENTS_HOST_DIR:-./data/work-attachments}:/app/storage/task-attachments

  shopping-service:
    build:
      context: ../../../microservices/shopping
    container_name: ${SHOPPING_CONTAINER_NAME:-alice-shopping-service}
    hostname: ${SHOPPING_HOSTNAME:-shopping-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8086
      SHOPPING_DB_URL: jdbc:postgresql://postgres:5432/${SHOPPING_DB_NAME:-shopping}
      SHOPPING_DB_USERNAME: ${SHOPPING_DB_USERNAME:-shopping}
      SHOPPING_DB_PASSWORD: ${SHOPPING_DB_PASSWORD:-shopping123}
    ports:
      - "${SHOPPING_PUBLIC_PORT:-8086}:8086"

  knowledge-service:
    build:
      context: ../../../microservices/knowledge
    container_name: ${KNOWLEDGE_CONTAINER_NAME:-alice-knowledge-service}
    hostname: ${KNOWLEDGE_HOSTNAME:-knowledge-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8087
      KNOWLEDGE_DB_URL: jdbc:postgresql://postgres:5432/${KNOWLEDGE_DB_NAME:-knowledge}
      KNOWLEDGE_DB_USERNAME: ${KNOWLEDGE_DB_USERNAME:-knowledge}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:-knowledge123}
      KNOWLEDGE_STORAGE_DIRECTORY: /app/storage/projects
      LLM_BASE_URL: http://llm-service:8084
    ports:
      - "${KNOWLEDGE_PUBLIC_PORT:-8087}:8087"
    volumes:
      - ${KNOWLEDGE_STORAGE_HOST_DIR:-./data/knowledge-projects}:/app/storage/projects

volumes:
  postgres_data:
  rabbitmq_data:
